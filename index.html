<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CalSnap – ถ่ายรูปอาหาร นับแคลอรี่</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eaf4ff; --card:#ffffff; --ink:#0b2545; --muted:#5b7090; --line:#d6e6fa;
  --blue:#2f80ed; --blue2:#56ccf2; --deep:#1b4fa8; --soft:#e3f0ff; --danger:#e5484d; --ok:#17a673;
  --shadow:0 10px 30px rgba(47,128,237,.15);
}
*{box-sizing:border-box;margin:0}
body{font-family:'Prompt',system-ui,sans-serif;background:linear-gradient(180deg,#d4e9ff 0,var(--bg) 320px);color:var(--ink);min-height:100vh;padding:env(safe-area-inset-top) 0 calc(40px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.logo{font-weight:700;font-size:22px;color:var(--deep);display:flex;align-items:center;gap:8px}
.logo i{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--blue2));display:grid;place-items:center;color:#fff;font-style:normal;font-size:16px}
button{font-family:inherit;cursor:pointer;border:0}
.icon-btn{background:#fff;width:40px;height:40px;border-radius:12px;box-shadow:var(--shadow);font-size:18px}
.card{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.hero{display:flex;align-items:center;gap:18px;background:linear-gradient(135deg,#2f80ed,#1b4fa8);color:#fff}
.ring{position:relative;width:150px;height:150px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-size:34px;line-height:1}
.ring span{font-size:12px;opacity:.85}
.hero h2{font-size:15px;font-weight:500;opacity:.9;margin-bottom:6px}
.hero .left{font-size:24px;font-weight:600;line-height:1.2}
.hero small{display:block;opacity:.8;margin-top:6px;font-size:13px}
.snap{width:100%;padding:18px;border-radius:20px;font-size:18px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--blue2),var(--blue));box-shadow:0 10px 24px rgba(47,128,237,.35);margin-bottom:16px}
.snap:active{transform:scale(.98)}
h3{font-size:16px;margin-bottom:12px}
.entry{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.entry:first-of-type{border-top:0}
.thumb{width:58px;height:58px;border-radius:14px;background:var(--soft) center/cover;flex:none;display:grid;place-items:center;font-size:24px}
.entry .t{flex:1;min-width:0}
.entry .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .t span{font-size:12px;color:var(--muted)}
.kcal{font-weight:700;color:var(--deep);white-space:nowrap}
.del{background:none;color:var(--muted);font-size:18px;padding:6px}
.empty{text-align:center;color:var(--muted);padding:18px 0;font-size:14px}
.week{display:flex;gap:8px;align-items:flex-end;height:110px}
.week div{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.week .bar{background:linear-gradient(180deg,var(--blue2),var(--blue));border-radius:8px 8px 4px 4px;margin:0 auto 4px;width:100%;min-height:4px}
.week .over .bar{background:linear-gradient(180deg,#ff8a8e,var(--danger))}
.week .col{display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.week em{font-style:normal;font-size:10px;color:var(--ink)}
/* modal */
dialog{border:0;border-radius:26px;padding:0;width:min(520px,94vw);max-height:92vh;box-shadow:0 20px 60px rgba(11,37,69,.35);color:var(--ink);font-family:inherit}
dialog::backdrop{background:rgba(11,37,69,.5);backdrop-filter:blur(3px)}
.m{padding:22px}
.m img.pv{width:100%;max-height:240px;object-fit:cover;border-radius:18px;margin-bottom:14px;background:var(--soft)}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input[type=text],input[type=number],input[type=password],select{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;font:inherit;color:var(--ink);background:#fff}
input:focus,select:focus{outline:2px solid var(--blue);border-color:transparent}
.row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.row .n{flex:1}
.row .k{width:92px}
.row .p{font-size:11px;color:var(--muted)}
.total{display:flex;justify-content:space-between;font-size:18px;font-weight:700;padding:12px 0;color:var(--deep)}
.btns{display:flex;gap:10px;margin-top:10px}
.btn{flex:1;padding:14px;border-radius:14px;font-size:16px;font-weight:600}
.primary{background:linear-gradient(135deg,var(--blue2),var(--blue));color:#fff}
.ghost{background:var(--soft);color:var(--deep)}
.status{text-align:center;padding:30px 0;color:var(--muted)}
.spin{width:44px;height:44px;border-radius:50%;border:5px solid var(--soft);border-top-color:var(--blue);margin:0 auto 14px;animation:s 0.9s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.err{background:#fff0f0;color:var(--danger);padding:12px;border-radius:14px;font-size:14px;margin:10px 0}
.hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
@media (max-width:420px){.hero{flex-direction:column;text-align:center}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><i>◔</i> CalSnap</div>
    <button class="icon-btn" id="openSet" aria-label="ตั้งค่า">⚙️</button>
  </header>

  <section class="card hero">
    <div class="ring">
      <svg width="150" height="150" viewBox="0 0 150 150">
        <circle cx="75" cy="75" r="64" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="14"/>
        <circle id="arc" cx="75" cy="75" r="64" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" stroke-dasharray="402" stroke-dashoffset="402" style="transition:stroke-dashoffset .8s ease"/>
      </svg>
      <div class="num"><b id="total">0</b><span>กิโลแคลอรี่</span></div>
    </div>
    <div>
      <h2 id="dateLabel"></h2>
      <div class="left" id="leftTxt"></div>
      <small id="goalTxt"></small>
    </div>
  </section>

  <button class="snap" id="snapBtn">📸 ถ่ายรูปอาหาร</button>
  <input type="file" id="file" accept="image/*" capture="environment" hidden>

  <section class="card">
    <h3>มื้ออาหารวันนี้</h3>
    <div id="list"></div>
  </section>

  <section class="card">
    <h3>7 วันล่าสุด</h3>
    <div class="week" id="week"></div>
  </section>
</div>

<dialog id="dlg"><div class="m" id="dlgBody"></div></dialog>

<dialog id="setDlg"><div class="m">
  <h3>ตั้งค่า</h3>
  <label>Gemini API Key</label>
  <input type="password" id="apiKey" placeholder="AIza..." autocomplete="off">
  <label>โมเดล</label>
  <input type="text" id="model" list="models" placeholder="gemini-flash-latest"><datalist id="models"><option value="gemini-flash-latest"><option value="gemini-3.5-flash-lite"><option value="gemini-3.7-flash"></datalist>
  <label>เป้าหมายแคลอรี่ต่อวัน</label>
  <input type="number" id="goal" min="500" max="10000" step="50">
  <p class="hint">คีย์และข้อมูลทั้งหมดเก็บไว้ใน Local Storage ของเบราว์เซอร์เครื่องนี้เท่านั้น รูปอาหารจะถูกส่งไปยัง Google Gemini เพื่อวิเคราะห์ตอนกดถ่ายเท่านั้น</p>
  <div class="btns"><button class="btn ghost" id="clearAll">ล้างข้อมูล</button><button class="btn primary" id="saveSet">บันทึก</button></div>
</div></dialog>

<script>
const $=id=>document.getElementById(id);
const LS='calsnap_gemini_v1';
let db=load();if(/^gemini-2/.test(db.model)){db.model='gemini-flash-latest';save()}
function load(){try{const d=JSON.parse(localStorage.getItem(LS));if(d&&d.entries)return d}catch(e){}return{entries:[],goal:2000,key:'',model:'gemini-flash-latest'}}
function save(){try{localStorage.setItem(LS,JSON.stringify(db))}catch(e){alert('พื้นที่เก็บข้อมูลเต็ม ลองลบรายการเก่าออกก่อน')}}
const dkey=(d=new Date())=>{const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sumDay=k=>db.entries.filter(e=>e.date===k).reduce((a,e)=>a+e.kcal,0);

function render(){
  const today=dkey(), total=sumDay(today), goal=db.goal, left=goal-total;
  $('total').textContent=total.toLocaleString();
  $('arc').style.strokeDashoffset=402-402*Math.min(total/goal,1);
  $('dateLabel').textContent=new Date().toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long'});
  $('leftTxt').textContent=left>=0?`เหลืออีก ${left.toLocaleString()} kcal`:`เกินมา ${(-left).toLocaleString()} kcal`;
  $('goalTxt').textContent=`เป้าหมาย ${goal.toLocaleString()} kcal ต่อวัน`;
  const list=db.entries.filter(e=>e.date===today).sort((a,b)=>b.id-a.id);
  $('list').innerHTML=list.length?list.map(e=>`<div class="entry">
    <div class="thumb" style="${e.thumb?`background-image:url(${e.thumb})`:''}">${e.thumb?'':'🍽️'}</div>
    <div class="t"><b>${esc(e.name)}</b><span>${esc(e.items.map(i=>i.name).join(', '))} · ${e.time}</span></div>
    <div class="kcal">${e.kcal}</div><button class="del" data-id="${e.id}" aria-label="ลบ">✕</button></div>`).join('')
    :'<div class="empty">ยังไม่มีมื้อวันนี้ กดถ่ายรูปอาหารได้เลย</div>';
  const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return d});
  const vals=days.map(d=>sumDay(dkey(d))), max=Math.max(goal,...vals);
  $('week').innerHTML=days.map((d,i)=>`<div class="col ${vals[i]>goal?'over':''}"><em>${vals[i]||''}</em><div class="bar" style="height:${vals[i]/max*70}%"></div>${d.toLocaleDateString('th-TH',{weekday:'short'})}</div>`).join('');
}
$('list').onclick=e=>{const b=e.target.closest('.del');if(!b)return;if(confirm('ลบมื้อนี้?')){db.entries=db.entries.filter(x=>x.id!=b.dataset.id);save();render()}};

/* ---------- image ---------- */
function resize(img,max,q){const r=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}
function readImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=rej;i.src=u})}

$('snapBtn').onclick=()=>{if(!db.key){openSettings('กรุณาใส่ Gemini API Key ก่อนเริ่มใช้งาน');return}$('file').click()};
$('file').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  let big,thumb;
  try{const img=await readImg(f);big=resize(img,896,.82);thumb=resize(img,140,.7)}catch(x){return alert('เปิดรูปไม่ได้')}
  const dlg=$('dlg');
  $('dlgBody').innerHTML=`<img class="pv" src="${big}"><div class="status"><div class="spin"></div>AI กำลังดูว่านี่คืออาหารอะไร...</div>`;
  dlg.showModal();
  try{showResult(await analyze(big),big,thumb)}catch(x){
    $('dlgBody').innerHTML=`<img class="pv" src="${big}"><div class="err">${esc(x.message)}</div><div class="btns"><button class="btn ghost" id="cancel">ปิด</button><button class="btn primary" id="retry">ลองอีกครั้ง</button></div>`;
    $('cancel').onclick=()=>dlg.close();
    $('retry').onclick=()=>{dlg.close();$('file').click()};
  }
};

async function analyze(dataUrl){
  const prompt='คุณคือนักโภชนาการ วิเคราะห์รูปอาหารนี้ ประเมินแคลอรี่ตามปริมาณที่เห็นในภาพ (ถ้าเป็นอาหารไทยให้อ้างอิงขนาดจานทั่วไป) ตอบเป็น JSON เท่านั้น รูปแบบ: {"is_food":true,"meal_name":"ชื่อเมนูภาษาไทย","items":[{"name":"ชื่อรายการ","portion":"ปริมาณโดยประมาณ","kcal":ตัวเลข}]} ถ้าในภาพไม่มีอาหารให้ is_food เป็น false และ items เป็น []';
  const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(db.model)+':generateContent',{method:'POST',
    headers:{'Content-Type':'application/json','x-goog-api-key':db.key},
    body:JSON.stringify({contents:[{parts:[{text:prompt},{inline_data:{mime_type:'image/jpeg',data:dataUrl.split(',')[1]}}]}],
      generationConfig:{responseMimeType:'application/json'}})
  }).catch(()=>{throw new Error('เชื่อมต่อ Gemini ไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่')});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const m=j.error&&j.error.message||'';throw new Error(r.status===429?'ใช้งานเกินโควต้าฟรี รอสักครู่แล้วลองใหม่: '+m:(r.status===400||r.status===403)&&/key/i.test(m)?'API Key ไม่ถูกต้อง กรุณาตรวจสอบในหน้าตั้งค่า':r.status===404?'ไม่พบโมเดล "'+db.model+'" ลองเปลี่ยนชื่อโมเดลในหน้าตั้งค่า':'เกิดข้อผิดพลาด ('+r.status+') '+m)}
  let d;try{d=JSON.parse(j.candidates[0].content.parts.map(p=>p.text||'').join('').replace(/```json|```/g,'').trim())}catch(e){throw new Error('อ่านผลวิเคราะห์ไม่สำเร็จ ลองถ่ายใหม่อีกครั้ง')}
  if(!d.is_food||!d.items||!d.items.length)throw new Error('ไม่พบอาหารในภาพ ลองถ่ายให้ชัดขึ้น');
  return d;
}

function showResult(d,big,thumb){
  const items=d.items.map(i=>({name:String(i.name),portion:i.portion||'',kcal:Math.round(Number(i.kcal)||0)}));
  const body=$('dlgBody');
  body.innerHTML=`<img class="pv" src="${big}">
    <label>ชื่อเมนู</label><input type="text" id="mName" value="${esc(d.meal_name||items[0].name)}">
    <label>รายการอาหารและแคลอรี่ (แก้ไขได้)</label><div id="rows"></div>
    <div class="total"><span>รวมทั้งหมด</span><span><span id="sum">0</span> kcal</span></div>
    <div class="btns"><button class="btn ghost" id="cancel">ยกเลิก</button><button class="btn primary" id="saveMeal">บันทึกมื้อนี้</button></div>`;
  const rows=$('rows');
  rows.innerHTML=items.map((it,i)=>`<div class="row"><div class="n"><input type="text" data-i="${i}" data-f="name" value="${esc(it.name)}"><div class="p">${esc(it.portion)}</div></div><input class="k" type="number" min="0" data-i="${i}" data-f="kcal" value="${it.kcal}"></div>`).join('');
  const upd=()=>$('sum').textContent=items.reduce((a,i)=>a+i.kcal,0);
  rows.oninput=e=>{const t=e.target,it=items[t.dataset.i];it[t.dataset.f]=t.dataset.f==='kcal'?Math.max(0,Math.round(+t.value||0)):t.value;upd()};
  upd();
  $('cancel').onclick=()=>$('dlg').close();
  $('saveMeal').onclick=()=>{
    const now=new Date();
    db.entries.push({id:Date.now(),date:dkey(now),time:now.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}),
      name:$('mName').value.trim()||items[0].name,items,kcal:items.reduce((a,i)=>a+i.kcal,0),thumb});
    save();render();$('dlg').close();
  };
}

/* ---------- settings ---------- */
function openSettings(msg){
  $('apiKey').value=db.key;$('model').value=db.model;$('goal').value=db.goal;
  $('setDlg').showModal();if(msg)setTimeout(()=>alert(msg),50);
}
$('openSet').onclick=()=>openSettings();
$('saveSet').onclick=()=>{db.key=$('apiKey').value.trim();db.model=$('model').value.trim()||'gemini-flash-latest';db.goal=Math.max(500,+$('goal').value||2000);save();render();$('setDlg').close()};
$('clearAll').onclick=()=>{if(confirm('ลบประวัติอาหารทั้งหมด? (API Key จะยังอยู่)')){db.entries=[];save();render();$('setDlg').close()}};
[$('dlg'),$('setDlg')].forEach(d=>d.addEventListener('click',e=>{if(e.target===d)d.close()}));
render();
</script>
</body>
</html>
